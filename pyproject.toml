[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidaa-remote-gnome"
version = "0.1.0"
description = "A native GNOME remote for VIDAA televisions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ijaz Muhammed"}]
dependencies = ["paho-mqtt==2.1.0"]
keywords = ["gnome", "vidaa", "hisense", "tv", "mqtt", "gtk4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["cryptography>=41"]

[project.scripts]
vidaa-remote = "app:main"

[project.urls]
Repository = "https://github.com/ijaz-miks/vidaa-remote-gnome"
Issues = "https://github.com/ijaz-miks/vidaa-remote-gnome/issues"

[tool.setuptools]
py-modules = ["app", "backend"]
